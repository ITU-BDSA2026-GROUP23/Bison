name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

        # Windows
      - name: Publish Windows
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/win-x64

        # Linux
      - name: Publish Linux
        run: dotnet publish -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/linux-x64

        # MacOS 
      - name: Publish MacOS
        run: dotnet publish -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/osx-x64

      - name: Zip Windows 
        run: zip -r ./publish/bison-win-x64.zip ./publish/win-x64

      - name: Zip Linux
        run: zip -r ./publish/bison-linux-x64.zip ./publish/linux-x64

      - name: Zip MacOS
        run: zip -r ./publish/bison-osx-x64.zip ./publish/osx-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/bison-win-x64.zip
            ./publish/bison-linux-x64.zip
            ./publish/bison-osx-x64.zip
          