name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

        # Windows
      - name: Publish Windows
        run: dotnet publish ./Bison.CLI/Bison.CLI.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/win-x64

        # Linux
      - name: Publish Linux
        run: dotnet publish ./Bison.CLI/Bison.CLI.csproj  -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/linux-x64

        # MacOS 
      - name: Publish MacOS
        run: dotnet publish ./Bison.CLI/Bison.CLI.csproj -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o ./publish/osx-x64

      - name: Zip Executables
        run: |
          cd publish
          zip -r bison-win-x64.zip win-x64
          zip -r bison-linux-x64.zip linux-x64
          zip -r bison-osx-x64.zip osx-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/bison-win-x64.zip
            ./publish/bison-linux-x64.zip
            ./publish/bison-osx-x64.zip
          